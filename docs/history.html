<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit History - Subsidiaries Verification</title>
    <link rel="stylesheet" href="./styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="page-layout">
    
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-brand">Subsidiaries<span>AI</span></div>
        <div class="nav-links">
            <a href="./index.html" class="nav-link">Verify Tool</a>
            <a href="./history.html" class="nav-link active">Audit History</a>
        </div>
    </nav>

    <main class="page-content">
        <div class="header-banner">
            <h2>Full Audit History</h2>
            <p>A complete log of all past verifications. This dashboard fills the entire desktop site.</p>
        </div>
        
        <div class="content-card full-page-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <input type="text" id="history-search" placeholder="Search history..." style="width: 100%; max-width: 400px; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: #0a0a0a; color: var(--text-color);">
            </div>
            <div class="table-responsive">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Parent Company</th>
                            <th>File Name</th>
                            <th>Checked</th>
                            <th>Incorrect</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- History populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="./history.js?v=3"></script>
</body>
</html>
